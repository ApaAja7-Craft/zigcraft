name: apk
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Pasang Android NDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;29.0.13113456" "build-tools;35.0.0" "platforms;android-35"
      - run: zig build -Dandroid=true --verbose
        working-directory: sdk/examples/minimal
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-apk
          path: sdk/examples/minimal/zig-out/bin/*.apk
