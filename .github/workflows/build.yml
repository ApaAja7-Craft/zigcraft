name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig version
      - run: zig run dunia.zig
      - run: zig build-exe dunia.zig -target aarch64-linux-musl -O ReleaseSmall -femit-bin=dunia-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: dunia-arm64
          path: dunia-arm64
